<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saveurs Maison - Inscription</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/vendor/bootstrap-icons/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <div class="auth-page">
    <div class="container">

      <div class="text-center mb-4">
        <a href="accueil.html">
          <img src="../assets/images/logo.png" alt="Saveurs Maison" class="auth-logo">
        </a>
      </div>

      <div class="row justify-content-center">
        <div class="col-lg-9">
          <div class="auth-card row g-0">

            <div class="col-md-5 auth-visual d-none d-md-block">
              <img src="../assets/images/tarte-pommes.jpg" alt="Tarte aux pommes maison">
              <div class="auth-visual-caption">
                <p>La cuisine est encore meilleure quand elle se partage.</p>
                <div class="accent-line"></div>
              </div>
            </div>

            <div class="col-md-7">
              <div class="auth-form-wrap">
                <p class="auth-eyebrow mb-2">Bienvenue à table</p>
                <h1 class="auth-title font-serif h2">Créer un compte</h1>
                <p class="auth-subtext mb-4">Vos prochaines découvertes gourmandes commencent ici.</p>

                <form class="auth-form">
                  <div class="row g-3 mb-3">
                    <div class="col-sm-6">
                      <label class="form-label" for="nom">Nom <span class="text-terracotta">*</span></label>
                      <input type="text" class="form-control" id="nom" placeholder="Votre nom">
                    </div>
                    <div class="col-sm-6">
                      <label class="form-label" for="prenom">Prénom <span class="text-terracotta">*</span></label>
                      <input type="text" class="form-control" id="prenom" placeholder="Votre prénom">
                    </div>
                  </div>

                  <div class="mb-3">
                    <label class="form-label" for="email">Adresse e-mail <span class="text-terracotta">*</span></label>
                    <input type="email" class="form-control" id="email" placeholder="vous@exemple.fr">
                  </div>

                  <div class="mb-3">
                    <label class="form-label" for="motdepasse">Mot de passe <span class="text-terracotta">*</span></label>
                    <div class="input-with-icon">
                      <input type="password" class="form-control" id="motdepasse">
                      <i class="bi bi-eye toggle-eye"></i>
                    </div>
                    <div class="auth-hint mt-1">Au moins 8 caractères.</div>
                  </div>

                  <div class="mb-3">
                    <label class="form-label" for="confirmation">Confirmer le mot de passe <span class="text-terracotta">*</span></label>
                    <div class="input-with-icon">
                      <input type="password" class="form-control" id="confirmation">
                      <i class="bi bi-eye toggle-eye"></i>
                    </div>
                  </div>

                  <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="rgpd">
                    <label class="form-check-label" for="rgpd">
                      J'ai lu la <a href="#">politique de confidentialité</a>.
                    </label>
                  </div>

                  <button type="button" class="btn btn-green w-100">Créer mon compte</button>

                  <p class="auth-footer-links">Déjà membre ? <a href="connexion.html">Se connecter</a></p>
                </form>
              </div>
            </div>

          </div>
        </div>
      </div>

      <p class="auth-footer-links mt-4">
        <a href="#">Mentions légales</a> &nbsp;&middot;&nbsp; <a href="#">Confidentialité</a>
      </p>

    </div>
  </div>

</body>
</html>
