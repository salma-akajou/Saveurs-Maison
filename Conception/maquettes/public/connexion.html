<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Saveurs Maison — Connexion</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/vendor/bootstrap-icons/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <main class="auth-page auth-login">
    <div class="auth-layout">

      <a href="accueil.html" class="auth-brand">
        <img
          src="../assets/images/logo.png"
          alt="Saveurs Maison — Retour à l’accueil"
          class="auth-logo"
        >
      </a>

      <div class="auth-card row g-0">

        <!-- PHOTO -->
        <div class="col-md-5 auth-visual d-none d-md-block">
          <img
            src="../assets/images/salade-mediterraneenne.jpg"
            alt="Salade méditerranéenne maison"
          >

          <div class="auth-visual-caption">
            <p>Le plaisir du fait maison vous attend.</p>
            <div class="accent-line"></div>
          </div>
        </div>

        <!-- FORMULAIRE -->
        <div class="col-md-7">
          <div class="auth-form-wrap">

            <p class="auth-eyebrow">Heureux de vous revoir</p>

            <h1 class="auth-title">Se connecter</h1>

            <p class="auth-subtext">
              Retrouvez vos favoris et partagez vos inspirations.
            </p>

            <!-- Maquette : le traitement PHP sera ajouté ensuite -->
            <form class="auth-form" onsubmit="event.preventDefault()">

              <div class="auth-field">
                <label class="form-label" for="email">
                  Adresse e-mail
                </label>

                <input
                  type="email"
                  class="form-control"
                  id="email"
                  name="email"
                  placeholder="vous@exemple.fr"
                  autocomplete="username"
                  maxlength="100"
                  required
                >
              </div>

              <div class="auth-field">
                <label class="form-label" for="motdepasse">
                  Mot de passe
                </label>

                <div class="input-with-icon">
                  <input
                    type="password"
                    class="form-control"
                    id="motdepasse"
                    name="mot_de_passe"
                    autocomplete="current-password"
                    required
                  >

                  <button
                    type="button"
                    class="toggle-eye"
                    id="afficher-motdepasse"
                    aria-label="Afficher le mot de passe"
                    aria-pressed="false"
                  >
                    <i class="bi bi-eye" aria-hidden="true"></i>
                  </button>
                </div>
              </div>

              <button type="submit" class="btn btn-green w-100">
                Se connecter
              </button>

              <p class="auth-switch">
                Pas encore de compte ?
                <a href="inscription.html">Créer un compte</a>
              </p>

            </form>

          </div>
        </div>

      </div>

    </div>
  </main>

  <script>
    const bouton = document.getElementById("afficher-motdepasse");
    const champ = document.getElementById("motdepasse");

    bouton.addEventListener("click", () => {
      const afficher = champ.type === "password";

      champ.type = afficher ? "text" : "password";

      bouton.setAttribute("aria-pressed", String(afficher));
      bouton.setAttribute(
        "aria-label",
        afficher
          ? "Masquer le mot de passe"
          : "Afficher le mot de passe"
      );

      bouton.querySelector("i").className =
        afficher ? "bi bi-eye-slash" : "bi bi-eye";
    });
  </script>
</body>
</html>
