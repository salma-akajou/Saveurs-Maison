<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saveurs Maison - Connexion</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <div class="auth-page">
    <div class="container">

      <div class="text-center mb-4">
        <a href="accueil.html">
          <img src="../assets/images/logo.png" alt="Saveurs Maison" class="auth-logo">
        </a>
      </div>

      <div class="row justify-content-center">
        <div class="col-lg-9">
          <div class="auth-card row g-0">

            <div class="col-md-5 auth-visual d-none d-md-block">
              <img src="../assets/images/connexion-salade.jpg" alt="Salade composée maison">
              <div class="auth-visual-caption">
                <p>Le plaisir du fait maison vous attend.</p>
                <div class="accent-line"></div>
              </div>
            </div>

            <div class="col-md-7">
              <div class="auth-form-wrap">
                <p class="auth-eyebrow mb-2">Heureux de vous revoir</p>
                <h1 class="auth-title font-serif h2">Se connecter</h1>
                <p class="auth-subtext mb-4">Retrouvez vos favoris et partagez vos inspirations.</p>

                <form class="auth-form">
                  <div class="mb-3">
                    <label class="form-label" for="email">Adresse e-mail</label>
                    <input type="email" class="form-control" id="email" placeholder="vous@exemple.fr">
                  </div>

                  <div class="mb-4">
                    <label class="form-label" for="motdepasse">Mot de passe</label>
                    <div class="input-with-icon">
                      <input type="password" class="form-control" id="motdepasse">
                      <i class="bi bi-eye toggle-eye"></i>
                    </div>
                  </div>

                  <button type="button" class="btn btn-green w-100">Se connecter</button>

                  <p class="auth-footer-links">Pas encore de compte ? <a href="inscription.html">Créer un compte</a></p>
                </form>
              </div>
            </div>

          </div>
        </div>
      </div>

      <p class="auth-footer-links mt-4">
        <a href="#">Mentions légales</a> &nbsp;&middot;&nbsp; <a href="#">Confidentialité</a>
      </p>

    </div>
  </div>

</body>
</html>
